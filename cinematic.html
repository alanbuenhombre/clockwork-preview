/* ================= reveal + fx helpers ================= */
function useInView(threshold) {
  const ref = useRef(null); const [seen, setSeen] = useState(false);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const io = new IntersectionObserver((es) => { es.forEach((x) => { if (x.isIntersecting) { setSeen(true); io.disconnect(); } }); }, { threshold: threshold || 0.15 });
    io.observe(el); return () => io.disconnect();
  }, []);
  return [ref, seen];
}
function Fx({ as = "div", show = true, delay = 0, className = "", style, children, ...rest }) {
  const El = as;
  return <El className={className + " fx" + (show ? " run" : "")} style={{ animationDelay: delay + "s", ...style }} {...rest}>{children}</El>;
}
/* Hero headline: Manrope light on two lines, one serif-italic accent word */
function HeroHeadline() {
  const [ref, seen] = useInView(0.1);
  const sans = "font-body font-light tracking-[-1.5px] text-4xl md:text-6xl lg:text-[3.9rem]";
  const serif = "font-heading italic tracking-[-1px] text-4xl md:text-6xl lg:text-[4.2rem]";
  const W = (w, cls, i, last) => (<span key={w} className={"bw" + (seen ? " run" : "") + " " + cls} style={{ animationDelay: (i * 0.1) + "s", marginRight: last ? 0 : "0.24em" }}>{w}</span>);
  return (
    <h1 ref={ref} className="mt-6 flex flex-col items-center leading-[0.95] text-white">
      <span className="flex flex-wrap justify-center">{W("Growth", sans, 0)}{W("should", sans, 1)}{W("run", sans, 2, true)}</span>
      <span className="flex flex-wrap justify-center">{W("like", sans, 3)}{W("clockwork", serif, 4, true)}</span>
    </h1>
  );
}

/* ================= FadingVideo ================= */
const FADE_MS = 500, FADE_OUT_LEAD = 0.55;
function FadingVideo({ src, className, style }) {
  const ref = useRef(null), rafRef = useRef(0), fadingOutRef = useRef(false);
  useEffect(() => {
    const v = ref.current; if (!v) return;
    const fadeTo = (target, duration) => {
      cancelAnimationFrame(rafRef.current);
      const start = performance.now(), from = parseFloat(v.style.opacity || "0");
      const step = (now) => { const t = Math.min(1, (now - start) / duration); v.style.opacity = String(from + (target - from) * t); if (t < 1) rafRef.current = requestAnimationFrame(step); };
      rafRef.current = requestAnimationFrame(step);
    };
    const onLoaded = () => { v.style.opacity = "0"; v.play().catch(() => {}); fadeTo(1, FADE_MS); };
    const onTime = () => { if (!fadingOutRef.current && v.duration && (v.duration - v.currentTime) <= FADE_OUT_LEAD && (v.duration - v.currentTime) > 0) { fadingOutRef.current = true; fadeTo(0, FADE_MS); } };
    const onEnded = () => { v.style.opacity = "0"; setTimeout(() => { v.currentTime = 0; v.play().catch(() => {}); fadingOutRef.current = false; fadeTo(1, FADE_MS); }, 100); };
    v.addEventListener("loadeddata", onLoaded); v.addEventListener("timeupdate", onTime); v.addEventListener("ended", onEnded);
    return () => { cancelAnimationFrame(rafRef.current); v.removeEventListener("loadeddata", onLoaded); v.removeEventListener("timeupdate", onTime); v.removeEventListener("ended", onEnded); };
  }, []);
  return <video ref={ref} src={src} autoPlay muted playsInline preload="auto" className={className} style={{ opacity: 0, ...style }} />;
}

/* ================= Hue slider (accent color for the card-outline glow) ================= */
function HueSlider() {
  const [h, setH] = useState(145);
  useEffect(() => { document.documentElement.style.setProperty("--glow-hue", h); }, [h]);
  return (
    <div className="fixed bottom-4 right-4 z-[70] liquid-glass rounded-full pl-3 pr-3.5 py-2 flex items-center gap-2.5">
      <span className="w-3 h-3 rounded-full shrink-0" style={{ background: `hsl(${h} 95% 62%)`, boxShadow: `0 0 8px hsl(${h} 95% 62%)` }} />
      <input type="range" min="0" max="360" value={h} onChange={(e) => setH(+e.target.value)} className="w-24 cursor-pointer" style={{ accentColor: `hsl(${h} 95% 62%)` }} aria-label="Accent color" />
    </div>
  );
}

function App() {
  useEffect(() => {
    let raf = 0, last = null;
    const update = () => {
      raf = 0;
      if (!last) return;
      document.querySelectorAll(".tech-edge").forEach((c) => {
        const r = c.getBoundingClientRect();
        if (r.bottom < -300 || r.top > window.innerHeight + 300) return;
        c.style.setProperty("--mx", (last.clientX - r.left).toFixed(1));
        c.style.setProperty("--my", (last.clientY - r.top).toFixed(1));
      });
    };
    const move = (e) => { last = e; if (!raf) raf = requestAnimationFrame(update); };
    window.addEventListener("pointermove", move);
    return () => { window.removeEventListener("pointermove", move); cancelAnimationFrame(raf); };
  }, []);
  return (
    <div className="bg-black">
      <Hero />
      <HowItWorks />
      <Statement />
      <Workflow />
      <Engagements />
      <WhyClockwork />
      <Contact />
      <Footer />
      <HueSlider />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
